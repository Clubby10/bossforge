# Recipe keys must match the EliteBosses boss IDs. Slots are zero-based.
recipes:
  abyssal_leviathan:
    display-slot: 10
    display-material: MONSTER_EGG
    display-data: 94
    display-name: '&5&lAbyssal Leviathan'
    display-lore:
      - '&8Something colossal stirs beneath'
      - '&8the lightless waters...'
      - ''
      - '&dClick to perform the ritual.'
    ingredients:
      abyssal_scale: 16
      binding_rune: 4

  celestial-devourer:
    display-slot: 11
